name: CI/CD Pipeline avec Security

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/uts:latest

    # Sécurité: contrôler que tous les secrets sont présents (optionnel mais conseillé)
    - name: Vérifier les secrets nécessaires
      run: |
        [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]] && echo "DOCKERHUB_USERNAME manquant" && exit 1
        [[ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]] && echo "DOCKERHUB_TOKEN manquant" && exit 1
        [[ -z "${{ secrets.COSIGN_PRIVATE_KEY }}" ]] && echo "COSIGN_PRIVATE_KEY manquant" && exit 1
        [[ -z "${{ secrets.COSIGN_PASSWORD }}" ]] && echo "COSIGN_PASSWORD manquant" && exit 1

    # Installer Cosign sur le runner
    - name: Install Cosign
      run: |
        curl -LO https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
        chmod +x cosign-linux-amd64
        sudo mv cosign-linux-amd64 /usr/local/bin/cosign

    - name: Sign the image with Cosign
      env:
        COSIGN_EXPERIMENTAL: "true"
      run: |
        echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
        echo "${{ secrets.COSIGN_PASSWORD }}" > cosign.password
        cosign sign --key cosign.key --password $(cat cosign.password) ${{ secrets.DOCKERHUB_USERNAME }}/uts:latest
