name: CI/CD Pipeline avec Security

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Nécessaire pour l'authentification OIDC avec Sigstore

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build_and_push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/utsp:latest

      - name: Install Cosign
        run: |
          curl -LO https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign-linux-amd64
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign

      - name: Sign the image with Cosign
        env:
          COSIGN_EXPERIMENTAL: "true"
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          
          # Récupérer le digest de l'image poussée
          IMAGE_DIGEST=${{ steps.docker_build_and_push.outputs.digest }}
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/uts2:latest"

          # Signer l'image en utilisant le digest pour une sécurité maximale
          cosign sign --yes --key cosign.key "${IMAGE_TAG}"@"${IMAGE_DIGEST}"
